<!DOCTYPE html>
<html>
    <head>
        <title>SafePlate</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="titleDiv">
            <h1>SafePlate</h1>
            <p>Cook confidently, no matter the diet.</p>
        </div>
        <div class="formDiv">
            <form>
                <label for="recipe">Paste recipe:</label>
                <textarea id="recipe" placeholder="Paste your recipe here, ingredients and instructions included..."></textarea>
                <label>Dietary Restrictions (select one or more):</label>
                <div id="restrictionButtons">
                    <button type="button" class="restriction-btn" data-value="vegan">Vegan</button>
                    <button type="button" class="restriction-btn" data-value="gluten-free">Gluten-Free</button>
                    <button type="button" class="restriction-btn" data-value="dairy-free">Dairy-Free</button>
                    <button type="button" class="restriction-btn" data-value="nut-free">Nut-Free</button>
                    <button type="button" class="restriction-btn" data-value="low-sodium">Low-Sodium</button>
                </div>
                <button id="rewriteBtn" type="button">Rewrite Recipe</button>
            </form>
            <p id="statusMessage"></p>
        </div>
        <div class="outputDiv" id="output">
            <p id="disclaimer">⚠️ SafePlate uses AI and can make mistakes — always double-check the rewritten recipe yourself, especially for allergies or medical dietary needs, before cooking or eating.</p>
            <button type="button" id="copyBtn">Copy Recipe</button>
            <h3>Ingredients</h3>
            <ul id="ingredientsList"></ul>

            <h3>Instructions</h3>
            <ol id="instructionsList"></ol>

            <h3>Substitutions</h3>
            <div id="substitutionsList"></div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
